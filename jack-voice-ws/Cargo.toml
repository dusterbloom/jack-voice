[package]
name = "jack-voice-ws"
version.workspace = true
edition = "2021"

[lib]
doctest = false

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
anyhow = "1"

tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2"

sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "migrate"] }

jack-voice = { path = "../jack-voice" }

reqwest = { version = "0.12", features = ["json"] }

base64 = "0.22"
hound = "3.5"

async-stream = "0.3"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
livekit = ["dep:livekit"]

[dependencies.livekit]
version = "0.7"
optional = true

[dev-dependencies]
tokio-test = "0.4"
futures = "0.3"
tempfile = "3"
